<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF5350" />
      <stop offset="50%" stop-color="#E53935" />
      <stop offset="100%" stop-color="#C62828" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7f1d1d" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#redGrad)" filter="url(#shadow)"/>

  <!-- Subtle glow inner ring -->
  <rect x="36" y="36" width="440" height="440" rx="96" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.25"/>

  <!-- Open Book Symbol (White) -->
  <path d="M256 180 C 220 150, 160 150, 120 165 C 105 170, 95 185, 95 200 L 95 360 C 95 372, 110 380, 122 376 C 160 362, 215 362, 248 385 L 256 390 L 264 385 C 297 362, 352 362, 390 376 C 402 380, 417 372, 417 360 L 417 200 C 417 185, 407 170, 392 165 C 352 150, 292 150, 256 180 Z" 
        fill="#FFFFFF" />

  <!-- Book Spine Center Line -->
  <path d="M256 185 L 256 385" stroke="#E53935" stroke-width="6" stroke-linecap="round"/>

  <!-- Lovely Heart in the center top -->
  <path d="M256 135 C 256 135, 230 95, 195 95 C 165 95, 145 120, 145 150 C 145 190, 210 235, 256 265 C 302 235, 367 190, 367 150 C 367 120, 347 95, 317 95 C 282 95, 256 135, 256 135 Z" 
        fill="#FFFFFF" opacity="0.95"/>
  <path d="M256 142 C 256 142, 233 107, 202 107 C 175 107, 157 128, 157 154 C 157 188, 215 228, 256 254 C 297 228, 355 188, 355 154 C 355 128, 337 107, 310 107 C 279 107, 256 142, 256 142 Z" 
        fill="#E53935"/>

  <!-- Bookmark Ribbon Ribbon / Sparkle -->
  <path d="M256 270 L 270 300 L 305 303 L 278 326 L 286 360 L 256 342 L 226 360 L 234 326 L 207 303 L 242 300 Z" 
        fill="#FFD54F" stroke="#F57F17" stroke-width="2"/>

  <!-- Small playful pencils or stars -->
