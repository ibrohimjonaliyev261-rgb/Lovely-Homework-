  <circle cx="185" cy="270" r="10" fill="#E53935" opacity="0.7"/>
  <circle cx="327" cy="270" r="10" fill="#E53935" opacity="0.7"/>
  <circle cx="362" cy="270" r="10" fill="#E53935" opacity="0.7"/>
